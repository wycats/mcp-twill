[package]
name = "mcp-workspace-resolver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Resolve named workspace roots from MCP roots, Codex sandbox metadata, and declared workspaces."
documentation = "https://docs.rs/mcp-workspace-resolver"
readme = "README.md"
keywords = ["mcp", "workspace", "paths", "sandbox"]
categories = ["development-tools", "filesystem"]
publish = ["crates-io"]

[dependencies]
rmcp = { version = "1.7.0", default-features = false, optional = true }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[features]
rmcp = ["dep:rmcp"]

[lib]
name = "mcp_workspace_resolver"
path = "src/lib.rs"
