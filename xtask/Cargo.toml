[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
mcp-twill = { path = "../crates/mcp-twill" }
rmcp = { version = "1.7.0", features = ["client", "transport-io"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.23"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync"] }
