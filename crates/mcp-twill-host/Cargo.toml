[package]
name = "mcp-twill-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Compiled host profiles, generated adapters, and runtime policy for mcp-twill servers."
documentation = "https://docs.rs/mcp-twill-host"
readme = "README.md"
keywords = ["mcp", "vscode", "code-generation", "adapter", "typescript"]
categories = ["development-tools"]
publish = ["crates-io"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
mcp-twill = { version = "0.1.2", path = "../mcp-twill" }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value", "unbounded_depth"] }
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
anyhow = "1"
futures = "0.3"
